<!doctype html>
<html lang="sw">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Sauti · Msaidizi wa Kiswahili</title>
<link rel="stylesheet" href="/app.css">
<header class="bar">
  <div class="brand"><span class="logo" aria-hidden="true"><span class="wave"><i></i><i></i><i></i><i></i></span></span><div><strong>Sauti<span>.</span></strong><small>Msaidizi wa Kiswahili</small></div></div>
  <div class="tools">
    <button id="theme" type="button" aria-label="Tumia mandhari meusi" aria-pressed="false">◐</button>
    <button id="new-chat" type="button" hidden><span aria-hidden="true">＋</span> Mazungumzo mapya</button>
  </div>
</header>
<main class="workspace">
  <section id="welcome">
    <div class="hero">
      <div class="mascot" aria-hidden="true"><div class="halo"></div><span class="spark">✦</span><div class="robot"><div class="face"><i></i><i></i><b></b></div></div></div>
      <p class="eyebrow">MSAIDIZI WA KISWAHILI</p>
      <h1>Habari! <br><em>Nikusaidieje?</em></h1>
      <p class="lede">Andika ombi lako au chagua mojawapo ya mifano hii.</p>
    </div>
    <div class="prompts" aria-label="Mifano ya maombi">
      <button type="button" data-prompt="Weka kengele saa moja asubuhi."><span class="glyph lavender" aria-hidden="true">◷</span><span><strong>Weka kengele</strong><small>Saa moja asubuhi</small></span><span aria-hidden="true">↗</span></button>
      <button type="button" data-prompt="Hali ya hewa itakuwaje Nairobi kesho?"><span class="glyph blue" aria-hidden="true">☁</span><span><strong>Uliza hali ya hewa</strong><small>Nairobi kesho</small></span><span aria-hidden="true">↗</span></button>
      <button type="button" data-prompt="Panga mkutano Ijumaa saa nne."><span class="glyph pink" aria-hidden="true">▦</span><span><strong>Panga mkutano</strong><small>Ijumaa saa nne</small></span><span aria-hidden="true">↗</span></button>
      <button type="button" data-prompt="Andika dokezo la kununua maziwa."><span class="glyph green" aria-hidden="true">≡</span><span><strong>Andika dokezo</strong><small>Nunua maziwa</small></span><span aria-hidden="true">↗</span></button>
    </div>
  </section>
  <section id="conversation" aria-label="Mazungumzo" hidden>
    <h2><span class="chat-face" aria-hidden="true"><i></i><i></i></span> Mazungumzo</h2>
    <div id="thread" role="log" aria-label="Ujumbe wa mazungumzo" aria-live="polite" aria-relevant="additions"></div>
  </section>
  <form id="composer">
    <label for="message">Ombi lako</label>
    <div class="composer-row">
      <input id="message" name="message" maxlength="280" required autocomplete="off" placeholder="Andika kwa Kiswahili…" enterkeyhint="send">
      <button id="send" type="submit" disabled>Tuma <span aria-hidden="true">↑</span></button>
    </div>
    <p id="status" role="status"></p>
    <p class="caption">Sauti hueleza jinsi ilivyoelewa ombi lako.</p>
  </form>
</main>
<script src="/app.js" defer></script>
</html>
